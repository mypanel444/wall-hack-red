name: Build Long Range SO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b
    - name: Clone and Build Dobby
      run: |
        git clone --recursive https://github.com/jmpews/Dobby.git
        cd Dobby
        mkdir build
        cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release ..
        # Binago natin ito: Tinanggal yung -j4 para isa-isa lang (iwas out of memory)
        make
    - name: Build Long Range SO
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 ..
        make
    - name: Upload SO
      uses: actions/upload-artifact@v4
      with:
        name: liblongrange
        path: build/liblongrange.so
